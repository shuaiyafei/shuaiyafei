<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Yafei Shuai — Software Engineer</title>
<desc id="desc">Building practical AI agents, developer tools, and thoughtful web experiences. A gently animated orbit and rotating typed introductions.</desc>
<defs>
  <radialGradient id="haze"><stop stop-color="#a8d5d6" stop-opacity=".30"/><stop offset="1" stop-color="#a8d5d6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d7e1e6" stroke-width=".7" opacity=".32"/></pattern>
  <clipPath id="line-0">
  <rect x="56" y="212" width="0" height="52">
    <animate attributeName="width" values="0;0;590;590;0;0" keyTimes="0;0.03;0.16;0.27;0.31;1" dur="18s" begin="0s" repeatCount="indefinite"/>
  </rect>
</clipPath>
<clipPath id="line-1">
  <rect x="56" y="212" width="0" height="52">
    <animate attributeName="width" values="0;0;590;590;0;0" keyTimes="0;0.03;0.16;0.27;0.31;1" dur="18s" begin="6s" repeatCount="indefinite"/>
  </rect>
</clipPath>
<clipPath id="line-2">
  <rect x="56" y="212" width="0" height="52">
    <animate attributeName="width" values="0;0;590;590;0;0" keyTimes="0;0.03;0.16;0.27;0.31;1" dur="18s" begin="12s" repeatCount="indefinite"/>
  </rect>
</clipPath>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .orbit { transform-origin: 0 0; animation: orbit 32s linear infinite; }
  .breathe { animation: breathe 6s ease-in-out infinite; }
  .still { display: none; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { opacity:.38; } 50% { opacity:.95; } }
  @media (prefers-reduced-motion: reduce) {
    .moving { display: none; }
    .still { display: inline; }
    .orbit, .breathe { animation: none; }
  }
</style>
<rect x="1" y="1" width="1198" height="358" rx="22" fill="#f4f7f9" stroke="#d7e1e6"/>
<rect x="2" y="2" width="1196" height="356" rx="22" fill="url(#grid)"/>
<ellipse cx="1000" cy="180" rx="310" ry="260" fill="url(#haze)"/>
<path d="M56 55h24" stroke="#187c83" stroke-width="2"/>
<text class="mono" x="94" y="60" fill="#526c7c" font-size="13" letter-spacing="2.5">HELLO, I'M</text>
<text x="53" y="139" font-size="78" font-weight="650" letter-spacing="-3.5" fill="#172d3a">Yafei Shuai<tspan fill="#187c83">.</tspan></text>
<text x="56" y="185" font-size="22" fill="#526c7c">Software engineer. Curious by default.</text>
<text class="moving role" x="56" y="247" font-size="24" font-weight="450" fill="#187c83" clip-path="url(#line-0)">AI agents. Practical by design.</text>
<text class="moving role" x="56" y="247" font-size="24" font-weight="450" fill="#187c83" clip-path="url(#line-1)">Developer tools. Built with care.</text>
<text class="moving role" x="56" y="247" font-size="24" font-weight="450" fill="#187c83" clip-path="url(#line-2)">Web experiences. Made to feel right.</text>
<text class="still" x="56" y="247" font-size="24" fill="#187c83">AI agents. Tools. Thoughtful interfaces.</text>
<text class="mono" x="56" y="313" fill="#78909d" font-size="12" letter-spacing="2">BUILD / SHIP / REFINE</text>
<text x="752" y="313" fill="#78909d" font-size="13">Making complex things feel simple.</text>
<g transform="translate(994 165)">
  <circle r="108" fill="none" stroke="#d7e1e6" stroke-width="1"/>
  <circle r="82" fill="none" stroke="#d7e1e6" stroke-dasharray="2 9" opacity=".8"/>
  <path d="M-132 0H132M0-132V132" stroke="#d7e1e6" stroke-width=".8" opacity=".7"/>
  <rect x="-46" y="-46" width="92" height="92" rx="24" fill="#eaf0f4" stroke="#d7e1e6" transform="rotate(-12)"/>
  <text x="0" y="14" font-size="39" font-weight="600" letter-spacing="-2" text-anchor="middle" fill="#172d3a">YF<tspan fill="#187c83">.</tspan></text>
  <g class="orbit">
    <path d="M0-108A108 108 0 0 1 93.5 54" fill="none" stroke="#187c83" stroke-width="1.6" opacity=".42"/>
    <circle cx="0" cy="-108" r="5" fill="#187c83"/>
    <circle cx="0" cy="-108" r="12" fill="#187c83" opacity=".09"/>
  </g>
  <circle class="breathe" cx="-94" cy="53" r="3" fill="#187c83"/>
  <circle cx="95" cy="53" r="3" fill="#78909d"/>
</g>
</svg>
