<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
<title id="title">Software engineering — shuaiyafei</title>
<desc id="desc">Building practical AI agents, developer tools, and thoughtful web experiences. Rotating typed introductions.</desc>
<defs>
  <radialGradient id="haze"><stop stop-color="#a8d5d6" stop-opacity=".30"/><stop offset="1" stop-color="#a8d5d6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d7e1e6" stroke-width=".7" opacity=".32"/></pattern>
  <clipPath id="line-0">
  <rect x="42" y="191" width="0" height="52">
    <animate attributeName="width" values="0;0;590;590;0;0" keyTimes="0;0.03;0.16;0.27;0.31;1" dur="18s" begin="0s" repeatCount="indefinite"/>
  </rect>
</clipPath>
<clipPath id="line-1">
  <rect x="42" y="191" width="0" height="52">
    <animate attributeName="width" values="0;0;590;590;0;0" keyTimes="0;0.03;0.16;0.27;0.31;1" dur="18s" begin="6s" repeatCount="indefinite"/>
  </rect>
</clipPath>
<clipPath id="line-2">
  <rect x="42" y="191" width="0" height="52">
    <animate attributeName="width" values="0;0;590;590;0;0" keyTimes="0;0.03;0.16;0.27;0.31;1" dur="18s" begin="12s" repeatCount="indefinite"/>
  </rect>
</clipPath>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .still { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .moving { display: none; }
    .still { display: inline; }
  }
</style>
<rect x="1" y="1" width="638" height="428" rx="22" fill="#f4f7f9" stroke="#d7e1e6"/>
<rect x="2" y="2" width="636" height="426" rx="22" fill="url(#grid)"/>
<ellipse cx="535" cy="100" rx="310" ry="260" fill="url(#haze)"/>
<path d="M42 67h24" stroke="#187c83" stroke-width="2"/>
<text class="mono" x="80" y="72" fill="#526c7c" font-size="17" letter-spacing="2.5">SOFTWARE / OPEN SOURCE</text>
<text x="42" y="148" font-size="28" fill="#172d3a">Software engineer. Curious by default.</text>
<text class="moving role" x="42" y="226" font-size="26" font-weight="450" fill="#187c83" clip-path="url(#line-0)">AI agents. Practical by design.</text>
<text class="moving role" x="42" y="226" font-size="26" font-weight="450" fill="#187c83" clip-path="url(#line-1)">Developer tools. Built with care.</text>
<text class="moving role" x="42" y="226" font-size="26" font-weight="450" fill="#187c83" clip-path="url(#line-2)">Web experiences. Made to feel right.</text>
<text class="still" x="42" y="226" font-size="26" fill="#187c83">AI agents. Tools. Thoughtful interfaces.</text>
<path d="M42 284H598" stroke="#d7e1e6"/>
<text x="42" y="330" font-size="22" fill="#172d3a">Making complex things feel simple.</text>
<text class="mono" x="42" y="381" fill="#78909d" font-size="16" letter-spacing="1.1">BUILD / SHIP / REFINE</text>
</svg>
